<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시장경보 해제 캘린더</title>
<style>
:root{
  --bg:#f3f6f9;--panel:#fff;--panel-2:#f7f9fc;--navy:#172b4d;
  --line:#d9e0e8;--line-soft:#e9edf2;--ink:#172033;--ink-2:#475467;--ink-3:#667085;
  --accent:#175cd3;--accent-soft:#eaf2ff;--shadow:0 10px 26px rgba(23,43,77,.07);
  --up:#b42318;--down:#175cd3;
  --risk:#9f1239;--risk-bg:#ffe4e8;--warn:#b54708;--warn-bg:#fff1dc;--note:#7a5a00;--note-bg:#fff8c5;
  --heat:#6d28d9;--heat-bg:#f1e9ff;--halt:#344054;--halt-bg:#e4e7ec;--ok:#067647;--ok-bg:#dcfae6;
  --cau:#0e7090;--cau-bg:#dff4fa;
}
:root[data-theme="dark"]{
  --bg:#0d1420;--panel:#16202f;--panel-2:#1b2739;--line:#243348;--line-soft:#1e2b3d;
  --ink:#eaf1fa;--ink-2:#b3c3d6;--ink-3:#8296ad;--accent:#69b0ff;--accent-soft:rgba(105,176,255,.16);
  --up:#ff8a80;--down:#69b0ff;
  --risk:#ffb3c1;--risk-bg:#4a1522;--warn:#ffc58a;--warn-bg:#3f2a10;--note:#ffe380;--note-bg:#3a3210;
  --heat:#cdb4ff;--heat-bg:#2e1f52;--halt:#d0d5dd;--halt-bg:#2b3444;--ok:#7be0a8;--ok-bg:#12382a;
  --cau:#8fdcf2;--cau-bg:#10333f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1420;--panel:#16202f;--panel-2:#1b2739;--line:#243348;--line-soft:#1e2b3d;
  --ink:#eaf1fa;--ink-2:#b3c3d6;--ink-3:#8296ad;--accent:#69b0ff;--accent-soft:rgba(105,176,255,.16);
  --up:#ff8a80;--down:#69b0ff;
  --risk:#ffb3c1;--risk-bg:#4a1522;--warn:#ffc58a;--warn-bg:#3f2a10;--note:#ffe380;--note-bg:#3a3210;
  --heat:#cdb4ff;--heat-bg:#2e1f52;--halt:#d0d5dd;--halt-bg:#2b3444;--ok:#7be0a8;--ok-bg:#12382a;
  --cau:#8fdcf2;--cau-bg:#10333f;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}
header{background:var(--navy);color:#fff;padding:14px 16px}
header .row{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0}
header .sub{font-size:12.5px;color:#d5deea}
header button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;min-height:40px}
main{max-width:1280px;margin:0 auto;padding:14px 16px 40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;box-shadow:var(--shadow);min-height:44px}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:12.5px;color:var(--ink-2)}
.kpi.on{outline:2px solid var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 12px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:inherit;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h2{font-size:16px;margin:0 0 4px}
.panel .cap{font-size:12.5px;color:var(--ink-3);margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;border:1px solid transparent;cursor:pointer;line-height:1.5;margin:1px 2px 1px 0;background:var(--panel-2);color:var(--ink);white-space:nowrap}
.chip:focus-visible,.kpi:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.t-risk{background:var(--risk-bg);color:var(--risk)} .t-warn{background:var(--warn-bg);color:var(--warn)}
.t-note{background:var(--note-bg);color:var(--note)} .t-heat{background:var(--heat-bg);color:var(--heat)}
.t-halt{background:var(--halt-bg);color:var(--halt)} .t-ok{background:var(--ok-bg);color:var(--ok)}
.t-cau{background:var(--cau-bg);color:var(--cau)}
.dlg .chip{white-space:normal}
.tblwrap table{min-width:600px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.legend .chip{cursor:default}
/* 캘린더 */
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:6px;min-width:780px}
.cal .dow{font-size:12px;font-weight:700;color:var(--ink-2);text-align:center;padding:2px}
.day{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:6px;min-height:92px}
.day.past{opacity:.72}
.day.hol{background:repeating-linear-gradient(135deg,var(--panel-2),var(--panel-2) 6px,var(--line-soft) 6px,var(--line-soft) 12px)}
.day.next{border:2px solid var(--accent);background:var(--accent-soft)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700;margin-bottom:4px}
.day .dh em{font-style:normal;font-weight:600;font-size:11.5px;color:var(--accent)}
.day .grp{font-size:11.5px;color:var(--ink-2);margin-top:5px;line-height:1.35}
.ph{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;margin-right:3px;vertical-align:1px}
.ph-j{background:var(--accent-soft);color:var(--accent)} .ph-r{background:var(--ok-bg);color:var(--ok)} .ph-p{background:var(--halt-bg);color:var(--halt)}
.chip[hidden]{display:none}
.more-btn{background:var(--panel);border:1px dashed var(--line)}
.g .chip.ovf{display:none} .g.open .chip.ovf{display:inline-flex}
.stick{position:sticky;top:0;z-index:6;background:var(--bg);padding-top:6px}
.gsearch{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gsearch input{flex:1 1 260px;min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;min-height:44px}
.gsearch input:focus{outline:2px solid var(--accent);outline-offset:1px}
.gsearch .gclr{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer;min-height:44px}
.gsug{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0;font-size:12.5px}
.gsug .chip{font-size:12.5px;padding:4px 10px}
.gsug .chip small{font-weight:500;color:var(--ink-2);margin-left:4px}
.cal.qon .g .chip:not(.qm):not(.more-btn){display:none!important}
.cal.qon .g .chip.qm{display:inline-flex!important;outline:2px solid var(--accent);outline-offset:1px}
.cal.qon .g.qnone,.cal.qon .g .more-btn{display:none!important}
tr.qhide{display:none}
@media (max-width:760px){
  table.dt th,table.dt td{white-space:nowrap;vertical-align:middle}
  table.dt td.tx{max-width:230px;overflow:hidden;text-overflow:ellipsis}
  table.dt td .chip{white-space:nowrap}
  table.dt.it tbody td{height:68px}
  table.dt.oc tbody td{height:52px}
}
.gloss{margin:0 0 12px} .gloss summary{cursor:pointer;font-weight:700;padding:6px 0;min-height:44px;display:flex;align-items:center}
.gloss table{font-size:12.5px;min-width:720px} .gloss td:first-child{white-space:nowrap}
.dstrip{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;margin:6px 0 2px;color:var(--ink-2)} .dstrip b{color:var(--ink)}
.cal-nav{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.cal-nav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;min-height:40px}
/* 표 */
.tblwrap{overflow-x:auto;max-height:70vh;overflow-y:auto;border:1px solid var(--line-soft);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top;line-height:1.45}
th{position:sticky;top:0;background:var(--panel-2);font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;z-index:1}
td.r,th.r{text-align:right}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--accent-soft)}
.up{color:var(--up)} .down{color:var(--down)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;min-height:40px}
.toolbar button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;min-height:40px}
.muted{color:var(--ink-3)}
.warnbox{background:var(--note-bg);color:var(--note);border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
/* 상세 */
.ov{position:fixed;inset:0;background:rgba(10,18,30,.45);display:none;z-index:20;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 10px}
.ov.on{display:flex}
.dlg{background:var(--panel);color:var(--ink);border-radius:16px;max-width:760px;width:100%;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg h3{margin:0;font-size:18px}
.dlg .x{float:right;border:0;background:var(--panel-2);color:var(--ink);border-radius:8px;min-width:44px;min-height:44px;font-size:18px;cursor:pointer}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;background:var(--panel-2)}
.card .big{font-size:16px;font-weight:700;margin:6px 0}
.scrollx{overflow-x:auto}
.crit{width:100%;min-width:430px;font-size:13px;margin-top:6px;table-layout:fixed}
.crit th:last-child,.crit td:last-child{width:40%;white-space:normal;text-align:right}
.crit th{white-space:normal;position:static}
.crit td{border-bottom:1px dashed var(--line)}
.ct{width:100%;min-width:460px;font-size:13px;margin-top:6px;table-layout:fixed;border-collapse:collapse}
.ct th{position:static;white-space:normal;background:transparent;font-size:12px}
.ct td,.ct th{border-bottom:1px dashed var(--line);padding:7px 8px}
.ct th:nth-child(1),.ct td:nth-child(1){width:50%}
.ct th:nth-child(2),.ct td:nth-child(2){width:22%;text-align:right}
.ct th:nth-child(3),.ct td:nth-child(3){width:28%;text-align:right}
.ct tfoot td{font-weight:700;border-bottom:0}
@media (max-width:600px){
  .ct{min-width:0}
  .ct thead tr{display:block} .ct thead th{display:block;width:auto!important;text-align:left!important}
  .ct thead th:not(:first-child){display:none}
  .ct tbody tr,.ct tfoot tr{display:grid;grid-template-columns:1fr 1.1fr;gap:2px 10px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .ct td{border:0;padding:2px 4px;width:auto!important}
  .ct td:first-child{grid-column:1/-1}
  .ct td:nth-child(2){text-align:left!important;align-self:center}
}
.gcell{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:96px}
.gcell .gp{font-variant-numeric:tabular-nums;text-align:right}
.gbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.gbar span{display:block;height:100%;border-radius:3px;background:var(--accent)}
.gbar span.met-down{background:var(--ok)} .gbar span.met-up{background:var(--up)}
.gcell .gl{font-size:11px;color:var(--ink-3);text-align:right}
.gcell .gp.met-down{color:var(--ok);font-weight:700} .gcell .gp.met-up{color:var(--up);font-weight:700}
.gcell .gl.met-down{color:var(--ok);font-weight:700} .gcell .gl.met-up{color:var(--up);font-weight:700}
.spark{width:100%;height:auto;aspect-ratio:700/200;display:block}
.tip{position:fixed;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;box-shadow:var(--shadow);display:none;z-index:40}
.foot{font-size:12px;color:var(--ink-3);margin-top:20px}
.foot a,.dlg a,td a{color:var(--accent)}
@media (max-width:640px){header h1{font-size:17px}.kpis{grid-template-columns:repeat(3,1fr);gap:6px}.kpi{padding:8px}.kpi b{font-size:18px}.kpi span{font-size:11.5px}}
</style>
</head>

function gapBar(target, close, dir) {
  if (target == null || !close) return '<span class="muted">-</span>';
  const gap = target / close - 1;

  const met = rem <= 0;

  const lab = met ? (dir === 'down' ? `지금 종가면 해제 · 여유 ${(-rem * 100).toFixed(1)}%` : '지금 종가면 충족')

  return `<div class="gcell"><span class="gp ${met ? mc : ''}">${sgn(gap * 100)}</span><div class="gbar" role="img" aria-label="${esc(lab)}" title="기준 종가 ${won(close)} → 조건 ${won(target)} · 막대는 하루 가격제한폭 30% 기준"><span class="${mc}" style="width:${fill.toFixed(0)}%"></span></div><span class="gl ${mc}">${esc(lab)}</span></div>`;

    return {big: r.release_lb != null ? `${fmtD(r.next)} 종가 ${won(r.release_lb)} 이하면 ${fmtD(r.release_day)}부터 해제 (남은 종가와 무관하게 확정된 값)` : `${fmtD(r.next)}가 첫 해제 판단일`, lines:[head, known.length ? `지금 확정된 문턱: ${known.join(' · ')}` : '문턱 가격은 T-5·T-15 종가가 확정되면 계산됩니다',
      r.hi14_pending ? `③ 직전 14일 최고가: 지금까지 ${won(r.hi14_known)} (남은 ${r.hi14_pending}거래일 종가에 따라 올라갈 수 있음)` : ''].filter(Boolean), rel:r};
  }
  case 'warn_notice': case 'risk_notice': {
    const tgt = it.type === 'warn_notice' ? '투자경고' : '투자위험', fw = it.fw || {};
    const lines = [`예고 기간 ${fmtD(it.start)} ~ ${fmtD(it.end)} · 이 기간에 요건을 못 채우면 예고 소멸`];
    let big;
    if (fw.need) big = `${fmtD(fw.t)} 종가 ${won(fw.need)} 이상이면 ${fmtD(nextDay(fw.t))}부터 ${tgt} 지정`;
    else if (fw.need_account) big = `${fmtD(fw.t)} 종가 ${won(fw.need_account)} 이상 + 거래소 계좌요건 충족 시 ${tgt} 지정`;
    else if (fw.blocks && fw.blocks.every(b => !b.possible)) big = `${fmtD(fw.t)}에는 지정 불가 (시총 100위 이내 등)`;
    else big = `${fmtD(it.end)}까지 매일 지정 여부 판단`;
    if (fw.blocks && fw.blocks.some(b => b.conds.some(c => c.k === 'index' && c.idx_ret > 0)))
      lines.push('지수 조건은 판단일 지수가 기준 종가일과 같다고 놓고 계산 — 지수가 더 오르면 필요 가격도 오름(상세에 1%p당 금액)');
    return {big, lines};
  }
  case 'rewarn_watch': {
    if (th.need && th.possible === false) return {big:`시총 ${th.rank}위(100위 이내)라 재지정 대상 아님`, lines:[`재지정 감시 ~ ${fmtD(it.end)}`]};
    return {big: th.need ? `${fmtD(th.t)} 종가 ${won(th.need)} 이상이면 ${fmtD(nextDay(th.t))}부터 투자경고 재지정` : `${fmtD(it.end)}까지 재지정 감시`,
      lines:[`해제 후 재지정 감시 ~ ${fmtD(it.end)}`, th.need ? `조건(모두): 지정 전일(${fmtD(th.d_des)}) ${won(th.c_des)} 초과 · 해제 전일(${fmtD(th.d_rel)}) ${won(th.c_rel)} 초과 · T-2(${fmtD(th.t2)}) ${won(th.c_t2)} 대비 40%↑ = ${won(th.th40)} 이상 · 시총 100위 밖(현재 ${th.rank ? th.rank + '위' : '300위 밖'})` : ''].filter(Boolean)};
  }
  case 'halt_notice':
    return {big: th.need ? `${fmtD(it.start)} 종가 ${won(th.need)} 이상이면 ${fmtD(it.halt_day)} 1일 매매정지` : `${fmtD(it.start)} 종가로 정지 여부 판단`,
      lines:[th.th ? `D-2(${fmtD(th.d2)}) ${won(th.c_d2)} × ${1 + th.pct/100} = ${won(th.th)} 이상, 그리고 투자경고 지정 전일(${fmtD(th.pre_day)}) ${won(th.c_pre)} 초과` : ''].filter(Boolean)};
  case 'halt':
    return {big:`${fmtD(it.start)} 1일 매매거래정지`, lines:[it.reason || '']};
  case 'overheat': {
    const e = it.ext || {};
    const lines = [`${it.span}거래일 30분 단일가매매 · 지정 ${fmtD(it.start)} ~ 종료 ${fmtD(it.end)}`];
    if (it.gap) lines.push(`${e.rule}` + (e.gap != null ? ` · 현재 괴리율 ${e.gap}% (보통주 ${esc(e.common)})` : '') + (e.need ? ` · 우선주 종가가 보통주 종가×1.5(지금 기준 ${won(e.need)})를 넘으면 연장` : ''));
    else lines.push(e.done ? '이미 1회 연장됨 — 종료일 다음 날 해제' : `${e.rule}${e.need ? ` → ${fmtD(it.end)} 종가 ${won(e.need)} 이상이면 연장` : ''}`);
    return {big:`${fmtD(it.release_day)}부터 단기과열 해제 예정${!e.done && e.need ? (it.gap ? ` (우선주 종가 ${won(e.need)} 이하일 때)` : ` (종가 ${won(e.need)} 미만일 때)`) : ''}`, lines};
  }
  case 'overheat_notice': {
    if (!th.need) return {big:`${fmtD(it.end)}까지 단기과열 지정 여부 판단`, lines:[]};
    if (th.excluded) return {big:'투자경고·위험 종목이라 단기과열 지정 절차에서 제외', lines:[`예고 기간 ${fmtD(it.start)} ~ ${fmtD(it.end)}`]};
    if (th.excluded_cap) return {big:`시총 ${th.rank}위(100위 이내)라 단기과열 지정 대상에서 제외`, lines:[`예고 기간 ${fmtD(it.start)} ~ ${fmtD(it.end)}`]};
    const p = Math.max(th.need, th.up_need);
    return {big: it.any_of
        ? `${fmtD(th.t)} 종가 ${won(th.up_need)} 초과 + 아래 셋 중 하나면 ${fmtD(nextDay(th.t))}부터 단기과열(${it.span}일 단일가)`
        : `${fmtD(th.t)} 종가 ${won(p)} 이상 + 거래량 ${Number(th.vol_need).toLocaleString('ko-KR')}주 이상 + 변동폭 ${th.rng_need}% 이상이면 ${fmtD(nextDay(th.t))}부터 단기과열`,
      lines:[`예고 기간 ${fmtD(it.start)} ~ ${fmtD(it.end)} · 조건 ${it.any_of ? '① ② ③ 중 하나' : '① ② ③ 모두'} + 종가가 전일(${won(th.prev)})·예고 전일(${won(th.pre)})보다 높을 것`,
        `① 주가: 직전 40일 평균 ${won(th.avg40)} × 1.3 = ${won(th.need)} 이상`,
        `② 거래회전율: (전일 ${Number(th.vol_y).toLocaleString('ko-KR')}주 + 당일)/2 ≥ 40일 평균 ${Number(th.tv40).toLocaleString('ko-KR')}주 × 6 → 당일 ${Number(th.vol_need).toLocaleString('ko-KR')}주 이상`,
        `③ 변동성: (전일 ${th.rng_y}% + 당일)/2 ≥ 40일 평균 ${th.vo40}% × 1.5 → 당일 (고가−저가)/중간값 ${th.rng_need}% 이상`]};
  }
  }
  return {big:'', lines:[]};
}

/* ── 캘린더 이벤트 ── */
function calEvents() {
  const ev = {};
  const add = (d, e) => { if (!d) return; (ev[d] = ev[d] || []).push(e); };
  for (const it of DATA.items) {
    const T = TYPES[it.type], P = PH[it.type], D = dates(it);
    const daily = /notice|rewarn/.test(it.type) && it.type !== 'halt_notice';   // 예고류는 만료일까지 매일 판단 — 칸에서는 접어 둔다
    if (D.judge) add(D.judge, {cls:T.t, txt:it.name, grp:`${T.lab} · ${P.judge}`, ph:'j', ord:ORDER.indexOf(it.type) + (daily ? 10 : 0), daily, it});
    if (D.res) add(D.res, {cls:T.t, txt:it.name, grp:`${T.lab} · ${P.res}`, ph:'r', ord:ORDER.indexOf(it.type), it});
    if (D.extra) add(D.extra, {cls:T.t, txt:it.name, grp:`${T.lab} · ${P.extra}`, ph:'r', ord:ORDER.indexOf(it.type), it});
  }
  const PK = {warn_release:['t-ok','투자경고 해제 확정 → 다음 거래일 해제'], risk_release:['t-ok','투자위험 해제 확정 → 다음 거래일 투자경고로'],
    warn_designate:['t-warn','투자경고 지정 공시 → 다음 거래일 지정'], risk_designate:['t-risk','투자위험 지정 공시 → 다음 거래일 지정'],
    halt:['t-halt','매매정지 공시 → 다음 거래일 하루 정지'], overheat:['t-heat','단기과열 지정 공시 → 다음 거래일부터 단일가']};
  for (const p of DATA.past) {
    if (!PK[p.kind] || p.day > DATA.asof) continue;
    add(p.day, {cls:PK[p.kind][0], txt:p.name, grp:PK[p.kind][1], ph:'p', ord:20, past:p});
  }
  return ev;
}

const phTag = p => p === 'j' ? '<span class="ph ph-j">판단</span>' : p === 'r' ? '<span class="ph ph-r">적용</span>' : '<span class="ph ph-p">공시</span>';

let calOffset = 0;
function renderCal() {
  const days = DATA.calendar.days.slice(), hol = DATA.calendar.holidays;
  const all = [...new Set([...days, ...Object.keys(hol)])].sort();
  const ev = calEvents();
  // 주 단위 묶음 (월~금)
  const monday = d => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return iso(x); };
  const weeks = [...new Set(all.map(monday))].sort();
  const nextW = weeks.indexOf(monday(DATA.next_day));
  const start = Math.max(0, nextW - 2 + calOffset * 4), vis = weeks.slice(start, start + 6);
  let h = `<div class="panel"><h2>해제·지정 판단 캘린더</h2>
  <p class="cap">종목마다 날짜가 두 개 찍히고, 둘은 항상 하루 차이입니다. <span class="ph ph-j">판단</span> = 그날 <b>장 마감 종가</b>로 조건을 확인하는 날(결과는 그날 저녁 공시) · <span class="ph ph-r">적용</span> = 판단이 맞으면 <b>그날 아침부터</b> 실제로 바뀌는 날(해제·정지·예고 소멸) = 판단일의 다음 거래일 · <span class="ph ph-p">공시</span> = 지난 날에 실제로 나온 공시. 파란 테두리 = 다음 판단일(${fmtD(DATA.next_day)}). 칩을 누르면 조건 가격이 나옵니다.</p>
  <details class="gloss" open><summary>용어와 날짜 읽는 법 (누르면 접힘)</summary><div class="tblwrap"><table><thead><tr><th>표시</th><th>무슨 조치인가</th><th>판단일 = 언제 종가로 확인하나</th><th>적용일 = 언제부터 바뀌나</th></tr></thead><tbody>${
    GLOSS.map(g => `<tr><td><span class="chip ${g[0]}">${g[1]}</span></td><td>${g[2]}</td><td>${g[3]}</td><td>${g[4]}</td></tr>`).join('')}</tbody></table></div></details>
  <div class="cal-nav"><button data-m="-1" type="button">◀ 이전</button><button data-m="0" type="button">이번 주로</button><button data-m="1" type="button">다음 ▶</button>
  <span class="muted">${fmtD(vis[0])} 주 ~ ${fmtD(vis[vis.length - 1])} 주</span></div>
  <div class="calwrap"><div class="cal">${['월','화','수','목','금'].map(d => `<div class="dow">${d}</div>`).join('')}`;
  for (const w of vis) {
    for (let k = 0; k < 5; k++) {
      const x = new Date(w + 'T00:00:00'); x.setDate(x.getDate() + k);
      const d = iso(x);
      const isH = !!hol[d], past = d <= DATA.asof, isN = d === DATA.next_day;
      const list = ev[d] || [];
      const groups = {};
      list.forEach(e => (groups[e.grp] = groups[e.grp] || []).push(e));
      const gkeys = Object.keys(groups).sort((p, q) => { const A = groups[p][0], B = groups[q][0]; const ph = {j:0, r:1, p:2}; return (ph[A.ph] - ph[B.ph]) || (A.ord - B.ord); });
      h += `<div class="day${isH ? ' hol' : ''}${past ? ' past' : ''}${isN ? ' next' : ''}"><div class="dh"><span>${x.getMonth() + 1}/${x.getDate()}</span>${isH ? `<em>${esc(hol[d])} 휴장</em>` : isN ? '<em>다음 판단일</em>' : ''}</div>`;
      for (const g of gkeys) {
        const L = groups[g], MAX = L[0].daily ? 0 : 6;
        const closed = MAX ? `+${L.length - MAX} 더 보기 ▼` : `${L.length}종목 펼치기 ▼`;
        h += `<div class="g"><div class="grp">${phTag(L[0].ph)}${esc(g)} <b>${L.length}</b>${L[0].daily ? ' <span class="muted">— 감시 중, 만료일까지 매일 판단</span>' : ''}</div>`;
        h += L.map((e, i) => (e.it ? `<button type="button" class="chip ${e.cls}${i >= MAX ? ' ovf' : ''}" data-code="${e.it.code}">${esc(e.txt)}</button>`
          : `<a class="chip ${e.cls}${i >= MAX ? ' ovf' : ''}" href="${e.past.url}" target="_blank" rel="noopener" data-name="${esc(e.txt)}">${esc(e.txt)}</a>`)).join('');
        if (L.length > MAX) h += `<button type="button" class="chip more-btn" aria-expanded="false" data-closed="${esc(closed)}">${closed}</button>`;
        h += '</div>';
      }
      h += '</div>';
    }
  }
  h += '</div></div></div>';
  // 다음 판단일 요약
  const seen = new Set(), todays = [];
  (ev[DATA.next_day] || []).forEach(e => { if (e.it && e.ph === 'j' && !e.daily && !seen.has(e.it.code + e.it.type)) { seen.add(e.it.code + e.it.type); todays.push(e.it); } });
  const nDaily = (ev[DATA.next_day] || []).filter(e => e.daily).length;
  h += `<div class="panel"><h2>${fmtD(DATA.next_day)} 종가로 결정되는 종목 ${todays.length}건</h2><p class="cap">이 날 종가가 아래 조건에 들면 다음 거래일("적용일")부터 해제·정지·연장됩니다. 기준 종가일 ${fmtD(DATA.asof)}. 예고 감시 중인 ${nDaily}종목(매일 판단)은 "현재 적용 현황" 탭에 있습니다.</p>${itemTable(todays)}</div>`;
  $('#v-cal').innerHTML = h;
  $('#v-cal').querySelectorAll('.more-btn').forEach(b => b.onclick = () => {
    const g = b.closest('.g'), open = g.classList.toggle('open');
    b.textContent = open ? '접기 ▲' : b.dataset.closed;
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  applyQuery();
  $('#v-cal').querySelectorAll('.cal-nav button').forEach(b => b.onclick = () => { const m = +b.dataset.m; calOffset = m === 0 ? 0 : calOffset + m; renderCal(); });
}

/* ── 표 ── */
function rowOf(it) {
  const e = explain(it), m = meta(it.code), k = m.kis;
  const close = it.close;
  const target = it.rel && it.rel.release_max != null ? it.rel.release_max
    : it.rel && it.rel.release_lb != null ? it.rel.release_lb
    : it.fw ? (it.fw.need || it.fw.need_account || null)
    : it.type === 'overheat' ? ((it.ext && !it.ext.done && it.ext.need) || null)
    : (it.th && it.th.need) || null;
  const gap = target ? pct(target, close) : null;
  const dir = (it.type === 'warn' || it.type === 'risk') ? 'down' : 'up';
  const D = dates(it);
  return {it, e, m, k, close, gap, target, dir, when: D.judge || D.res, res: D.res, judge: D.judge};
}
function kisTxt(k) {
  if (!k) return '<span class="muted">-</span>';
  const s = [k.warn, k.overheat ? '단기과열' : null, k.halt ? '정지' : null, k.stat === '거래정지' ? '거래정지' : null].filter(Boolean);
  return s.length ? esc([...new Set(s)].join('·')) : '<span class="muted">해당없음</span>';
}
let sortKey = 'judge', sortDir = 1;
function itemTable(items, sortable) {
  const rows = items.map(rowOf);

function sparkSVG(it, lines) {
  const s = it.spark || []; if (s.length < 2) return '<p class="muted">시세 없음</p>';
  const Wd = 700, H = 200, L = 8, R = 150, T = 44, B = 22;
  const oh = it.ohlc && it.ohlc.d === s[s.length - 1][0] ? it.ohlc : null;
  const vals = s.map(x => x[1]).concat(lines.map(l => l.v)).concat(oh ? [oh.h, oh.l] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .08 || hi * .05; lo -= pad; hi += pad;
  const X = i => L + (Wd - L - R) * i / (s.length - 1), Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let g = `<svg class="spark" viewBox="0 0 ${Wd} ${H}" data-i="1" role="img" aria-label="${esc(it.name)} 최근 종가">`;
  g += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${s.map((x, i) => X(i).toFixed(1) + ',' + Y(x[1]).toFixed(1)).join(' ')}"/>`;
  const used = [];
  lines.forEach(l => {
    const y = Y(l.v); let ly = y + 4; while (used.some(u => Math.abs(u - ly) < 13)) ly += 13; used.push(ly);

      lines.push({v:cd.need, c:'var(--up)', t:'예고'});
    }
    if (k.caution) h += `<div class="card"><span class="chip t-cau">투자주의</span>
      <div class="big">${fmtD(k.caution.start)} 하루 투자주의 — 다음 거래일 자동 해제</div>
      ${condTable('투자주의', [{label:`사유: ${esc(k.caution.reason || '-')}`, text:`공시 ${fmtD(k.caution.notice)}`}], base.close, {label:'해제', text:'다음 거래일 자동 · 가격 조건 없음'})}</div>`;
    if (k.halt) h += `<div class="card"><span class="chip t-halt">매매거래정지</span>
      <div class="big">거래정지 중 — ${esc(k.halt.reason || '')}</div>
      ${condTable('매매거래정지', [{label:`정지 사유: ${esc(k.halt.reason || '-')}`, text:'시장경보 외 사유'}], base.close, {label:'재개', text:'거래소 공시로 결정 · 가격 조건 없음'})}</div>`;
  }
  // 4) 기준일 장중 터치 여부 — 오늘 판단한 선 + 다음 판단 선(중복 제거)
  const oh = base.ohlc;
  const judgedL = oc.filter(o => o.line).map(o => ({v:o.line, t:`${fmtD(o.judged)} ${o.line_label}`, rel:o.line_dir === 'down', judged:true}));
  const nextJ = its.map(i => dates(i).judge).filter(d => d && d > DATA.asof).sort()[0] || DATA.next_day;
  const upL = lines.filter(l => !judgedL.some(j => j.v === l.v)).map(l => ({v:l.v, t:`다음 판단(${fmtD(nextJ)}) ${l.t}선`, rel:l.t === '해제'}));
  const rowsT = judgedL.concat(upL);
  if (oh) {
    const touch = l => {
      const hit = l.rel ? oh.l <= l.v : oh.h >= l.v;
      const byClose = l.rel ? oh.c <= l.v : oh.c >= l.v;
      return `<tr><td>${l.judged ? '<b>' + esc(l.t) + '</b>' : esc(l.t)} ${won(l.v)}</td><td class="num">${hit ? `<b class="${l.rel ? 'down' : 'up'}">터치 (${l.rel ? '저가' : '고가'} ${won(l.rel ? oh.l : oh.h)})</b>` : '<span class="muted">터치 안 함</span>'}</td><td class="num">${byClose ? '<b>종가 충족</b>' : '<span class="muted">종가 미충족</span>'}</td></tr>`;
    };
    h += `<div class="card"><b>${fmtD(oh.d)} 장중 기준선 터치 여부</b> <span class="muted">(판단은 종가로만 하지만, 장중에 선을 넘었는지 참고)</span>
    <div class="dstrip"><span>시가 <b>${won(oh.o)}</b></span><span>고가 <b class="up">${won(oh.h)}</b></span><span>저가 <b class="down">${won(oh.l)}</b></span><span>종가 <b>${won(oh.c)}</b></span><span>거래량 <b>${Number(oh.v).toLocaleString('ko-KR')}주</b></span></div>
    ${rowsT.length ? `<div class="scrollx"><table class="ct"><thead><tr><th>기준선</th><th>장중</th><th>종가</th></tr></thead><tbody>${rowsT.map(touch).join('')}</tbody></table></div>` : '<div class="muted">가격 기준선이 없는 조치입니다</div>'}</div>`;
  }
  // 5) 그래프
  const chartLines = judgedL.map(j => ({v:j.v, c:j.rel ? 'var(--ok)' : 'var(--up)', t:`${j.t.replace(/\(.*$/, '').replace(/^(\d+)\/(\d+)\(.\) /, '$1/$2 ')} ${Math.round(j.v).toLocaleString()}`}))
    .concat(upL.map(l => ({v:l.v, c:l.rel ? 'var(--ok)' : 'var(--up)', t:`다음 ${l.t.replace(/^다음 판단\(.*?\) /, '').replace(/선$/, '')} ${Math.round(l.v).toLocaleString()}`}))).slice(0, 4);
  h += `<div class="card"><b>최근 40거래일 종가</b> <span class="muted">(굵은 점 = 기준일 ${fmtD(base.close_day)} 종가, 세로 막대 = 그날 고가~저가, 점선 = 조건 가격, 마우스를 올리면 값)</span>${sparkSVG(base, chartLines)}</div>`;
  $('#dlg').innerHTML = h; $('#ov').classList.add('on');
  const svg = $('#dlg svg.spark'); if (svg) bindSpark(svg, base);
  $('#dlg .x').onclick = closeDlg; $('#dlg .x').focus();
}
/* ── 통합 검색: 모든 탭의 캘린더 칩·표 행을 거르고, 맞는 종목을 바로 열 수 있게 띄운다 ── */
let Q = '';
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
let SIDX = null;
function searchIndex() {
  if (SIDX) return SIDX;
  const m = new Map();
  const add = (code, name, lab) => { if (!code) return; const e = m.get(code) || {code, name, labs:new Set()}; if (lab) e.labs.add(lab); m.set(code, e); };
  DATA.items.forEach(i => add(i.code, i.name, TYPES[i.type].lab));
  (DATA.expired || []).forEach(i => add(i.code, i.name, TYPES[i.type].lab + ' 판단 끝남'));
  Object.entries(DATA.extra || {}).forEach(([c, e]) => Object.keys(e.kinds || {}).forEach(k => add(c, e.name, {cand:'신규 후보', caution:'투자주의', halt:'거래정지'}[k])));
  (DATA.outcomes || []).forEach(o => add(o.code, o.name, o.what));
  SIDX = [...m.values()];
  return SIDX;
}
function applyQuery() {
  const q = norm(Q);
  // 캘린더
  const cal = document.querySelector('#v-cal .cal');
  if (cal) {
    cal.classList.toggle('qon', !!q);
    cal.querySelectorAll('.g').forEach(g => {
      let any = false;
      g.querySelectorAll('.chip:not(.more-btn)').forEach(c => {
        const hit = !!q && norm(c.textContent + (c.dataset.code || '')).includes(q);
        c.classList.toggle('qm', hit); any = any || hit;
      });
      g.classList.toggle('qnone', !!q && !any);
    });
  }
  // 모든 탭의 표 (용어 설명 표는 제외)
  document.querySelectorAll('main section tbody tr').forEach(tr => {
    if (tr.closest('.gloss')) return;
    const key = tr.textContent + (tr.dataset.code || '');
    tr.classList.toggle('qhide', !!q && !norm(key).includes(q));
  });
  // 맞는 종목 바로가기
  const box = $('#gsug');
  if (!q) { box.hidden = true; box.innerHTML = ''; $('#gclr').hidden = true; return; }
  $('#gclr').hidden = false;
  const hits = searchIndex().filter(e => norm(e.name + e.code).includes(q)).slice(0, 10);
  box.hidden = false;
  box.innerHTML = hits.length
    ? hits.map(e => `<button type="button" class="chip" data-code="${e.code}">${esc(e.name)}<small>${esc([...e.labs].slice(0, 3).join(' · '))}</small></button>`).join('') + '<span class="muted" style="align-self:center">누르면 상세 창</span>'
    : '<span class="muted">이 대시보드에 해당 종목이 없습니다 (지금 시장경보·후보·투자주의·거래정지에 없는 종목)</span>';
}
(() => {
  const inp = $('#gq');
  let tmr = null;
  inp.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(() => { Q = inp.value.trim(); applyQuery(); }, 120); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Escape') { inp.value = ''; Q = ''; applyQuery(); }
    if (e.key === 'Enter') { const b = $('#gsug .chip[data-code]'); if (b && $('#gsug').querySelectorAll('.chip[data-code]').length === 1) openStock(b.dataset.code); }
  });
  $('#gclr').onclick = () => { inp.value = ''; Q = ''; applyQuery(); inp.focus(); };
})();
function closeDlg() { $('#ov').classList.remove('on'); $('#tip').style.display = 'none'; }

/* ── KPI·탭·테마 ── */
function setFilter(t) { filter = t; renderKpi(); renderNow(); showTab('now'); }
function renderKpi() {
  const cnt = t => DATA.items.filter(i => i.type === t).length;
  const k = ORDER.filter(t => cnt(t)).map(t => `<button type="button" class="kpi${filter === t ? ' on' : ''}" data-f="${t}"><b class="num">${cnt(t)}</b><span>${TYPES[t].lab}</span></button>`);
  const oc = DATA.outcomes || [];
  k.unshift(`<button type="button" class="kpi" data-tab="res" style="background:var(--ok-bg)"><b class="num">${oc.filter(o => o.result === 'release' || o.result === 'lapse').length}</b><span>${fmtD(DATA.next_day)}부터 풀림</span></button>`,
            `<button type="button" class="kpi" data-tab="res" style="background:var(--warn-bg)"><b class="num">${oc.filter(o => o.result === 'hit' || o.result === 'maybe').length}</b><span>${fmtD(DATA.next_day)}부터 걸림</span></button>`);
  const nc = (DATA.cands && DATA.cands.warn || []).length;
  k.push(`<button type="button" class="kpi" data-tab="new"><b class="num">${nc}</b><span>신규 경고예고 후보</span></button>`);
  k.push(`<button type="button" class="kpi" data-tab="cau"><b class="num">${DATA.caution.rows.length}</b><span>투자주의 (${fmtD(DATA.caution.day)})</span></button>`);
  k.push(`<button type="button" class="kpi" data-tab="halt"><b class="num">${DATA.halts.length}</b><span>전체 거래정지</span></button>`);
  $('#kpis').innerHTML = k.join('');
  $('#kpis').querySelectorAll('[data-f]').forEach(b => b.onclick = () => setFilter(filter === b.dataset.f ? null : b.dataset.f));
  $('#kpis').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => showTab(b.dataset.tab));
}
function showTab(t) {
  setTimeout(applyQuery, 0);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  ['cal','res','now','new','cau','halt','log','rule'].forEach(x => $('#v-' + x).hidden = x !== t);
}
function isDark() { const a = document.documentElement.getAttribute('data-theme'); if (a === 'dark') return true; if (a === 'light') return false; return matchMedia('(prefers-color-scheme: dark)').matches; }
function syncThemeBtn() { $('#theme').textContent = isDark() ? '라이트 모드' : '다크 모드'; }
$('#theme').onclick = () => { document.documentElement.setAttribute('data-theme', isDark() ? 'light' : 'dark'); syncThemeBtn(); };
new MutationObserver(syncThemeBtn).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncThemeBtn);

document.addEventListener('click', e => {
  const c = e.target.closest('[data-code]');
  if (c && !e.target.closest('#dlg')) { openStock(c.dataset.code); return; }
  if (e.target === $('#ov')) closeDlg();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDlg(); });
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) showTab(b.dataset.t); };

$('#hsub').textContent = `기준 종가 ${fmtD(DATA.asof)} · 다음 판단일 ${fmtD(DATA.next_day)} · 갱신 ${DATA.generated}`;
$('#foot').innerHTML = `출처: KIND 시장조치 공시·투자주의/경고/위험 지정내역·매매거래정지 현황, KRX 정규장 15:30 종가·일봉(한국투자증권 Open API, 시간외 제외), 한국투자증권 Open API(현재 시장경보 상태 교차확인). 매 거래일 저녁 공시 뒤 자동 갱신. 투자 판단의 책임은 본인에게 있으며 이 화면은 정보 제공용입니다.`;
syncThemeBtn(); renderKpi(); renderCal(); renderRes(); renderNow(); renderNew(); renderCau(); renderHalt(); renderLog(); renderRule();
</script>
</body>
